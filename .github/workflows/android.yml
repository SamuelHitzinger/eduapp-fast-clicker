name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: The tested script is in the app
        run: test -s android/app/src/main/assets/fast-clicker.js

      # The release key stays in GitHub secrets; only builds of main are signed with it, so every build installs
      # over the previous one. Without the secrets the APK is signed with a throwaway debug key.
      - name: Signing key (main only)
        if: github.ref == 'refs/heads/main'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=$((100 + GITHUB_RUN_NUMBER)) --no-daemon --stacktrace

      - name: Check the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          mkdir -p out && cp "$APK" out/ETHClicker.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ETHClicker-apk
          path: out/ETHClicker.apk
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ETHClicker-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (install, launch, screenshot after 25 s, still running)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r ETHClicker.apk
            adb shell pm grant ch.students.ethclicker android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n ch.students.ethclicker/.MainActivity
            sleep 25
            adb exec-out screencap -p > smoke.png
            adb logcat -d -s AndroidRuntime:E | tail -n 40
            adb shell pidof ch.students.ethclicker

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: smoke.png
          retention-days: 14

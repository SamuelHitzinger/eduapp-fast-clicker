name: Build Android app

# Started by hand (Actions → Build Android app → Run workflow), to save GitHub's monthly build minutes.
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Also run the emulator smoke test (about 10 more minutes)"
        type: boolean
        default: false

# read-only token: the builds never write to the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      - name: The tested script is in the app
        run: test -s android/app/src/main/assets/fast-clicker.js

      # The release key stays in GitHub secrets; only builds of main are signed with it, so every build installs
      # over the previous one. Without the secrets the APK is signed with a throwaway debug key.
      - name: Signing key (main only; a main build without it fails instead of shipping a debug-signed app)
        if: github.ref == 'refs/heads/main'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::release signing key missing"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:   # the passwords only reach builds of main
          ANDROID_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: gradle assembleRelease -PversionCode=$((100 + GITHUB_RUN_NUMBER)) --no-daemon --stacktrace

      - name: Check the signature
        run: |
          set -o pipefail
          ls -la android/app/build/outputs/apk/release/
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK" 2>&1 | grep -v -i "warning" | head -n 8
          mkdir -p out && cp "$APK" out/Clicker.apk
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Clicker-apk
          path: out/Clicker.apk
          retention-days: 30

  smoke:
    needs: build
    if: inputs.smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Clicker-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (install, launch, screenshot after 25 s, still running)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r Clicker.apk
            adb shell pm grant ch.students.clicker android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n ch.students.clicker/ch.students.ethclicker.MainActivity
            sleep 25
            adb exec-out screencap -p > smoke.png
            adb logcat -d -s AndroidRuntime:E | tail -n 40
            adb shell pidof ch.students.clicker
            # the same first start in dark mode (fresh data)
            adb shell am force-stop ch.students.clicker
            adb shell pm clear ch.students.clicker
            adb shell pm grant ch.students.clicker android.permission.POST_NOTIFICATIONS || true
            adb shell cmd uimode night yes
            adb logcat -c
            adb shell am start -W -n ch.students.clicker/ch.students.ethclicker.MainActivity
            sleep 25
            adb exec-out screencap -p > smoke-dark.png
            adb logcat -d > smoke-log.txt
            adb shell pidof ch.students.clicker

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-smoke
          path: |
            smoke.png
            smoke-dark.png
            smoke-log.txt
          retention-days: 14

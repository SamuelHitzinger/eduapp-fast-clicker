name = "fast-clicker-relay"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# One Durable Object per room (a lecture); see src/worker.js. Rooms hibernate between messages.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

# SQLite-backed class: required for Durable Objects on the Workers Free plan.
# Storage holds only a room's recent hints (dedupe ids, 30 s replay), written when a hint is accepted.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

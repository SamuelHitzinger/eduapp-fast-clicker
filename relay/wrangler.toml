name = "fast-clicker-relay"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# One Durable Object per room (a lecture); see src/worker.js. Rooms hibernate between messages.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

# SQLite-backed class: required for Durable Objects on the Workers Free plan.
# Storage holds only a room's recent hints (dedupe ids, 30 s replay), written when a hint is accepted.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# Daily cleanup of metrics older than 90 days (src/worker.js cleanup()).
[triggers]
crons = ["17 3 * * *"]

# Workers Logs: errors (a failed metrics write, the cleanup) are kept for a few days in the dashboard.
[observability]
enabled = true

# Anonymous beta diagnostics (POST /v1/report from the apps, room snapshots from the rooms). Query: node tools/monitor.js
[[d1_databases]]
binding = "METRICS"
database_name = "clicker-metrics"
database_id = "6491f177-224d-483f-8dd9-6e5e0347b329"
migrations_dir = "migrations"
